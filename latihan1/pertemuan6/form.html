<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>
<body>
    <form action="">
        <fieldset>
            <legend>BIODATA</legend>
            <h1>DATA MAHASISWA</h1>
    NAMA :<input type="text" id="" name="nama"><br>
    NIM :<input type="number" id="" name="nim"><br>
    PRODI :<input type="text" id="" name="prodi"><br>
    FAKULTAS :<input type="text" id="" name="fakultas"><br>
    TANGGAL LAHIR :<input type="date" id="" name="tanggal lahir"><br>
    NOMOR TELEPON :<input type="number" id="" name="nomor telepon"><br>
    NAMA AYAH :<input type="text" id="" name="nama ayah"><br>
    NAMA IBU :<input type="text" id="" name="nama ibu"><br>
    ALAMAT :<input type="text" id="" name="alamat"><br>
    NIK :<input type="number" id="" name="nomor NIK"><br>
    SEKOLAH TERAKHIR :<input type="text" id="" name="sekolah terakhir"><br>
    NISN :<input type="text" id="" name="NISN"><br>
    <input type="submit" value="KIRIM">
        </fieldset>
        <fieldset>
            <legend>HOBBY</legend>
            <input type="radio" name="Tidur" value="Tidur">Tidur<br>
            <input type="radio" name="Berenang" value="Berenang">Berenang<br>
            <input type="radio" name="Menggambar" value="Menggambar">Menggambar<br>
            <input type="radio" name="Bernyanyi" value="Bernyanyi">Bernyanyi<br>
        </fieldset>
        <fieldset>
            <legend>MAKANAN FAVORIT</legend>
            <input type="checkbox" name="Bakso" value="Bakso">Bakso<br>
            <input type="checkbox" name="Sate" value="Sate">Sate<br>
            <input type="checkbox" name="Nasi goreng" value="Nasi goreng">Nasi goreng<br>
            <input type="checkbox" name="Nasi padang" value="Nasi padang">Nasi padang<br>
        </fieldset>
        <fieldset>
            <legend>PEKERJAAN ORANG TUA</legend>
        <select name="" id="">
            <option value="1">DPRD</option>
            <option value="2">KEPALA SEKOLAH</option>
            <option value="3">GURU</option>
            <option value="4">BURUH</option>
        </select>
        </fieldset>
        <fieldset>
            <legend>KETERANGAN</legend>
            <textarea name="saran" id="" cols="30" rows="20"></textarea>
        </fieldset>
        <input type="submit" value="DONE">
    </form>
</body>
</html>
